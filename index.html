<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube WatchParty</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0f0f0f; color: #f1f1f1;
      font-family: 'Roboto', 'Hiragino Sans', sans-serif;
    }
    #lobby {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #222, #0a0a0a);
    }
    .lobby-box {
      background: #181818; padding: 34px; border-radius: 16px; width: 420px;
      text-align: center; box-shadow: 0 12px 35px rgba(0,0,0,0.8);
      border: 1px solid #2c2c2c;
    }
    .lobby-box input {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px;
      background: #0f0f0f; color: #fff; border: 1px solid #333; text-align: center; font-size: 16px;
    }
    .mode-btns { display: flex; gap: 10px; margin-top: 12px; }
    .mode-btns button {
      flex: 1; padding: 13px; border-radius: 10px; border: none; font-size: 15px;
      font-weight: bold; cursor: pointer;
    }
    .btn-create { background: #ff0000; color: #fff; }
    .btn-create:hover { background: #cc0000; }
    .btn-join-mode { background: #272727; color: #fff; border: 1px solid #444 !important; }
    #join-area { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid #2c2c2c; }
    .btn-enter {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: #3ea6ff; color: #0f0f0f; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px;
    }

    #app { display: none; }
    header {
      position: fixed; top: 0; left: 0; right: 0; height: 64px;
      background: rgba(15, 15, 15, 0.96); border-bottom: 1px solid #272727;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 12px; width: 32%; }
    .logo { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 17px; white-space: nowrap; }
    .logo-icon { background: #ff0000; color: #fff; padding: 2px 7px; border-radius: 6px; font-size: 12px; }
    .search-box { display: flex; flex: 1; }
    .search-box input {
      width: 100%; padding: 7px 12px; border-radius: 20px 0 0 20px;
      border: 1px solid #303030; background: #121212; color: #fff; outline: none; font-size: 13px;
    }
    .search-box button {
      padding: 7px 14px; border-radius: 0 20px 20px 0; border: 1px solid #303030;
      border-left: none; background: #222; color: #fff; cursor: pointer;
    }
    .header-center { text-align: center; flex: 1; }
    .room-code-big { font-size: 22px; font-weight: bold; color: #ffdd59; letter-spacing: 2px; }
    .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: 32%; }
    .badge { padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; }
    .host-badge { background: #f1c40f; color: #111; }
    .guest-badge { background: #272727; color: #aaa; }
    .leave-btn {
      background: #272727; color: #ff5e57; border: none; padding: 7px 14px;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .main-layout { display: flex; margin-top: 64px; height: calc(100vh - 64px); }
    .left-area { flex: 1; padding: 20px; overflow-y: auto; }
    .player-wrapper {
      width: 100%; aspect-ratio: 16 / 9; background: #000;
      border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6); position: relative;
    }
    .waiting-msg { color: #ffdd59; font-size: 20px; font-weight: bold; text-align: center; padding: 20px; }
    #video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 14px; }
    .video-card { cursor: pointer; background: #181818; border-radius: 10px; overflow: hidden; }
    .video-card:hover { border: 1px solid #ffdd59; }
    .video-card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
    .v-title { padding: 8px 10px 4px 10px; font-size: 13px; font-weight: bold; margin: 0; }
    .v-meta { padding: 0 10px 8px 10px; font-size: 11px; color: #aaa; margin: 0; }
    .right-sidebar { width: 340px; border-left: 1px solid #272727; background: #141414; display: flex; flex-direction: column; flex-shrink: 0; }
    .members-box { padding: 12px 14px; border-bottom: 1px solid #272727; background: #191919; max-height: 190px; overflow-y: auto; }
    .member-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 13px; border-bottom: 1px solid #222; }
    .kick-btn { background: #eb3b5a; color: #fff; border: none; padding: 3px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; font-weight: bold; }
    .chat-header { padding: 10px 14px; border-bottom: 1px solid #272727; font-weight: bold; font-size: 13px; color: #aaa; }
    #chat-list { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .chat-msg { background: #1f1f1f; padding: 8px 12px; border-radius: 8px; line-height: 1.4; word-break: break-all; }
    .chat-name { font-weight: bold; color: #3ea6ff; }
    .host-name { color: #f1c40f; }
    .chat-input-box { display: flex; padding: 10px; border-top: 1px solid #272727; gap: 6px; }
    .chat-input-box input { flex: 1; padding: 9px 12px; border-radius: 16px; border: 1px solid #333; background: #0f0f0f; color: #fff; outline: none; }
    .chat-input-box button { background: #3ea6ff; color: #0f0f0f; border: none; padding: 8px 16px; border-radius: 16px; font-weight: bold; cursor: pointer; }
    #notice-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 999; align-items: center; justify-content: center; }
    .notice-card { background: #1e1e1e; padding: 30px; border-radius: 16px; width: 380px; text-align: center; border: 1px solid #444; }
    .notice-card button { margin-top: 18px; padding: 10px 32px; border-radius: 10px; border: none; background: #ff0000; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="lobby">
    <div class="lobby-box">
      <div style="font-size: 26px; font-weight: bold; margin-bottom: 6px;">▶ YouTube WatchParty</div>
      <p style="font-size: 13px; color: #aaa; margin-bottom: 16px;">ニックネームを入力して部屋を作るか入ってください</p>
      <input type="text" id="name-input" placeholder="あなたのニックネーム (例: OOKA)">
      
      <div class="mode-btns">
        <button class="btn-create" onclick="handleCreateRoom()">＋ 部屋を作る</button>
        <button class="btn-join-mode" onclick="showJoinInput()">部屋に入る</button>
      </div>

      <div id="join-area">
        <input type="text" id="room-input" placeholder="5文字の部屋番号を入力" maxlength="5" style="text-transform: uppercase;">
        <button class="btn-enter" onclick="handleJoinRoom()">この部屋に入る</button>
      </div>
      <div id="lobby-status" style="margin-top: 12px; font-size: 13px; color: #ffdd59;"></div>
    </div>
  </div>

  <div id="app">
    <header>
      <div class="header-left">
        <div class="logo"><span class="logo-icon">▶</span> WatchParty</div>
        <div class="search-box" id="host-search-box">
          <input type="text" id="search-input" placeholder="YouTubeを検索..." onkeydown="if(event.key==='Enter') doSearch()">
          <button onclick="doSearch()">🔍</button>
        </div>
      </div>

      <div class="header-center">
        <div class="room-code-big">部屋番号：<span id="header-room-id">-----</span></div>
      </div>

      <div class="header-right">
        <span id="role-badge" class="badge">接続中...</span>
        <button class="leave-btn" onclick="leaveRoom()">退出</button>
      </div>
    </header>

    <div class="main-layout">
      <div class="left-area">
        <div class="player-wrapper" id="player-box">
          <div class="waiting-msg" id="status-screen">🔍 管理者が検索中（動画を選ぶまでお待ちください）...</div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
          <div>
            <h2 id="now-title" style="margin: 0 0 4px 0; font-size: 18px;">待機中</h2>
            <p id="now-channel" style="margin: 0; font-size: 13px; color: #aaa;"></p>
          </div>
          <a id="fallback-yt-link" href="#" target="_blank" style="display:none; background:#272727; color:#ffdd59; text-decoration:none; padding:8px 14px; border-radius:8px; font-size:12px; font-weight:bold;">▶ 再生されない場合はYouTubeで直接開く</a>
        </div>

        <div id="host-controls">
          <h3 style="margin: 22px 0 6px 0; font-size: 15px; color: #ffdd59;">👑 管理者メニュー：クリックで部屋に動画を挿入</h3>
          <div id="video-grid"></div>
        </div>
      </div>

      <div class="right-sidebar">
        <div class="members-box">
          <div style="font-size: 13px; color: #ffdd59; margin-bottom: 6px; font-weight: bold;">
            👥 参加人数：<span id="member-count">1</span>人
          </div>
          <div id="member-list"></div>
        </div>
        <div class="chat-header">💬 チャット</div>
        <div id="chat-list"></div>
        <div class="chat-input-box">
          <input type="text" id="chat-input" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter') sendChat()">
          <button onclick="sendChat()">送信</button>
        </div>
      </div>
    </div>
  </div>

  <div id="notice-modal">
    <div class="notice-card">
      <div id="notice-text" style="font-size: 17px; font-weight: bold; line-height: 1.5;"></div>
      <button onclick="closeNoticeAndReset()">完了</button>
    </div>
  </div>
  <script>
    const GAS_URL = 'https://google.com';
    const myId = 'U_' + Math.random().toString(36).substr(2, 6);

    let deviceId = localStorage.getItem('wp_device_id');
    if (!deviceId) {
      deviceId = 'DEV_' + Math.random().toString(36).substr(2, 10);
      localStorage.setItem('wp_device_id', deviceId);
    }

    let roomId = '', myName = '', isJoined = false, isHost = false;
    let currentPlayingId = null, renderedChats = new Set();

    function callGas(params) {
      return fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(params)
      }).then(function(res) {
        return res.json();
      });
    }

    function showJoinInput() {
      document.getElementById('join-area').style.display = 'block';
    }

    function handleCreateRoom() {
      const nameVal = document.getElementById('name-input').value.trim();
      if (!nameVal) {
        alert('先にニックネームを入力してください！');
        return;
      }
      myName = nameVal;
      document.getElementById('lobby-status').innerText = '部屋を作成中...';

      callGas({ cmd: 'create', userId: myId, userName: myName, deviceId: deviceId })
        .then(function(res) {
          document.getElementById('lobby-status').innerText = '';
          if (res.status === 'ok') {
            startRoomSession(res.roomId, true);
          } else {
            alert('部屋の作成に失敗しました。');
          }
        })
        .catch(function() {
          document.getElementById('lobby-status').innerText = '';
          alert('通信エラーが発生しました。');
        });
    }

    function handleJoinRoom() {
      const nameVal = document.getElementById('name-input').value.trim();
      const codeVal = document.getElementById('room-input').value.trim().toUpperCase();
      if (!nameVal) {
        alert('先にニックネームを入力してください！');
        return;
      }
      if (codeVal.length !== 5) {
        alert('5文字の部屋番号を入力してください！');
        return;
      }
      myName = nameVal;
      document.getElementById('lobby-status').innerText = '部屋に接続中...';

      callGas({ cmd: 'join', roomId: codeVal, userId: myId, userName: myName, deviceId: deviceId })
        .then(function(res) {
          document.getElementById('lobby-status').innerText = '';
          if (res.status === 'ok') {
            startRoomSession(res.roomId, false);
          } else if (res.status === 'banned') {
            showNoticeModal('この部屋から追放されているため、二度と入室できません。');
          } else {
            alert('その部屋番号は存在しないか、すでに削除されています。');
          }
        });
    }

    function startRoomSession(code, hostMode) {
      roomId = code;
      isHost = hostMode;
      isJoined = true;
      currentPlayingId = null;
      renderedChats.clear();

      document.getElementById('header-room-id').innerText = roomId;
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('chat-list').innerHTML = '';
      document.getElementById('fallback-yt-link').style.display = 'none';

      const box = document.getElementById('player-box');
      box.innerHTML = '';
      const waitDiv = document.createElement('div');
      waitDiv.className = 'waiting-msg';
      waitDiv.innerText = '🔍 管理者が検索中（動画を選ぶまでお待ちください）...';
      box.appendChild(waitDiv);

      if (isHost) {
        doSearch('人気 急上昇 日本');
      }
      syncLoop();
    }

    function leaveRoom() {
      if (!isJoined) return;
      isJoined = false;
      callGas({
        cmd: 'sync', roomId: roomId, userId: myId, userName: myName, deviceId: deviceId,
        action: JSON.stringify({ type: 'leave' })
      });
      closeNoticeAndReset();
    }

    function showNoticeModal(msg) {
      isJoined = false;
      document.getElementById('player-box').innerHTML = '';
      document.getElementById('notice-text').innerText = msg;
      document.getElementById('notice-modal').style.display = 'flex';
    }

    function closeNoticeAndReset() {
      document.getElementById('notice-modal').style.display = 'none';
      document.getElementById('player-box').innerHTML = '';
      document.getElementById('app').style.display = 'none';
      document.getElementById('lobby').style.display = 'flex';
    }
    function doSearch(defaultWord) {
      const q = defaultWord || document.getElementById('search-input').value.trim();
      const grid = document.getElementById('video-grid');
      grid.innerText = 'YouTubeを検索中...';
      callGas({ cmd: 'search', query: q }).then(function(videos) {
        grid.innerHTML = '';
        videos.forEach(function(v) {
          const card = document.createElement('div');
          card.className = 'video-card';
          card.onclick = function() { selectVideoForRoom(v); };

          const img = document.createElement('img');
          img.src = v.thumb;
          const pTitle = document.createElement('p');
          pTitle.className = 'v-title';
          pTitle.innerText = v.title;
          const pMeta = document.createElement('p');
          pMeta.className = 'v-meta';
          pMeta.innerText = v.channel;

          card.appendChild(img);
          card.appendChild(pTitle);
          card.appendChild(pMeta);
          grid.appendChild(card);
        });
      });
    }

    function selectVideoForRoom(v) {
      if (!isHost) return;
      const ok = confirm('「' + v.title + '」\n\nその動画を挿入します。よろしいですか？');
      if (ok) {
        applyVideo(v);
        callGas({
          cmd: 'sync', roomId: roomId, userId: myId, userName: myName, deviceId: deviceId,
          action: JSON.stringify({ type: 'setVideo', video: v })
        });
      }
    }

    function applyVideo(v) {
      if (!v || currentPlayingId === v.videoId) return;
      currentPlayingId = v.videoId;
      document.getElementById('now-title').innerText = v.title;
      document.getElementById('now-channel').innerText = v.channel;

      const s = String.fromCharCode(47);
      const origin = encodeURIComponent(window.location.origin);
      const embedUrl = 'https:' + s + s + '://youtube.com' + s + 'embed' + s + v.videoId + '?autoplay=1&rel=0&playsinline=1&origin=' + origin;
      const directUrl = 'https:' + s + s + '://youtube.com' + s + 'watch?v=' + v.videoId;

      const fallback = document.getElementById('fallback-yt-link');
      fallback.href = directUrl;
      fallback.style.display = 'inline-block';

      const box = document.getElementById('player-box');
      box.innerHTML = '';

      const iframe = document.createElement('iframe');
      iframe.src = embedUrl;
      iframe.style.cssText = 'width:100%;height:100%;border:none;';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.setAttribute('allowfullscreen', 'true');

      box.appendChild(iframe);
    }

    function kickUser(targetId, targetName) {
      if (!isHost) return;
      if (confirm(targetName + ' さんをこの部屋から永久追放しますか？')) {
        callGas({
          cmd: 'sync', roomId: roomId, userId: myId, userName: myName, deviceId: deviceId,
          action: JSON.stringify({ type: 'kick', targetId: targetId })
        });
      }
    }

    function sendChat() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const nowTime = new Date().toTimeString().slice(0, 5);
      appendChatDOM(myName, isHost, text, nowTime);

      callGas({
        cmd: 'sync', roomId: roomId, userId: myId, userName: myName, deviceId: deviceId,
        action: JSON.stringify({ type: 'chat', text: text })
      });
    }

    function appendChatDOM(user, hostFlag, text, time) {
      const cList = document.getElementById('chat-list');
      const div = document.createElement('div');
      div.className = 'chat-msg';

      const nameSpan = document.createElement('span');
      nameSpan.className = hostFlag ? 'chat-name host-name' : 'chat-name';
      nameSpan.innerText = (hostFlag ? '👑' : '') + user + '：';

      const textNode = document.createTextNode(text + ' ');

      const timeSpan = document.createElement('span');
      timeSpan.style.cssText = 'font-size:10px;color:#666;';
      timeSpan.innerText = '(' + time + ')';

      div.appendChild(nameSpan);
      div.appendChild(textNode);
      div.appendChild(timeSpan);
      cList.appendChild(div);
      cList.scrollTop = cList.scrollHeight;
    }

    function syncLoop() {
      if (!isJoined) return;

      callGas({ cmd: 'sync', roomId: roomId, userId: myId, userName: myName, deviceId: deviceId })
        .then(function(res) {
          if (!isJoined) return;

          if (res.status === 'banned') {
            showNoticeModal('この部屋から追放されました');
            return;
          }
          if (res.status === 'host_left') {
            showNoticeModal('管理者がこの部屋を退出されたため、削除されました。');
            return;
          }

          const room = res.room;
          isHost = (room.hostId === myId);

          const badge = document.getElementById('role-badge');
          badge.innerText = isHost ? '👑 あなたが管理者' : '👀 一般視聴者';
          badge.className = 'badge ' + (isHost ? 'host-badge' : 'guest-badge');

          document.getElementById('host-search-box').style.visibility = isHost ? 'visible' : 'hidden';
          document.getElementById('host-controls').style.display = isHost ? 'block' : 'none';

          if (room.currentVideo) {
            applyVideo(room.currentVideo);
          }

          const mList = document.getElementById('member-list');
          const members = Object.values(room.members);
          document.getElementById('member-count').innerText = members.length;
          mList.innerHTML = '';

          members.forEach(function(m) {
            const row = document.createElement('div');
            row.className = 'member-row';

            const nameSpan = document.createElement('span');
            nameSpan.innerText = (m.id === room.hostId ? '👑 ' : '') + m.name;
            row.appendChild(nameSpan);

            if (isHost && m.id !== myId) {
              const kickBtn = document.createElement('button');
              kickBtn.className = 'kick-btn';
              kickBtn.innerText = '追放';
              kickBtn.onclick = function() { kickUser(m.id, m.name); };
              row.appendChild(kickBtn);
            }
            mList.appendChild(row);
          });

          room.chats.forEach(function(c) {
            if (!renderedChats.has(c.id)) {
              renderedChats.add(c.id);
              if (c.senderId === myId) return;
              appendChatDOM(c.user, c.isHost, c.text, c.time);
            }
          });

          setTimeout(syncLoop, 600);
        })
        .catch(function() {
          if (isJoined) setTimeout(syncLoop, 1200);
        });
    }
  </script>
</body>
</html>
